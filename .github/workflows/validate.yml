name: Validate framework

on:
  pull_request:
  push:
    branches: [main, release/2.x]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical updater regressions need the released Git objects.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-framework.mjs
      - run: node --test --test-concurrency=4 tests/*.test.mjs
